# Project-wide Gradle settings for the printerdriver Android module.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Nothing credential-shaped belongs in this file (it is committed). Publishing
# credentials (GITHUB_ACTOR/GITHUB_TOKEN) and signing secrets
# (ORG_GRADLE_PROJECT_signingKey / ORG_GRADLE_PROJECT_signingPassword) are supplied by
# the environment/CI secrets -- see build.gradle.kts "Maven publishing" and "Signing".
