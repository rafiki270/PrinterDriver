# ReceiptStudio — the iOS example app for the PrinterDriver SDK.
#
# Generate with:  xcodegen generate
#
# No package manager anywhere in the loop: the C++ core is compiled straight into
# the app target from ../../../core, exactly the way a host app would vendor it.

name: ReceiptStudio

options:
  bundleIdPrefix: com.printerdriver
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    GCC_C_LANGUAGE_STANDARD: "gnu11"
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"

# The SDK design docs, visible in the navigator: docs/receipt-dsl.md is the
# document model the designer produces, docs/api.md §2/§4/§12 the API it drives.
fileGroups:
  - ../../../docs

targets:
  ReceiptStudio:
    type: application
    platform: iOS
    sources:
      - path: ReceiptStudio
      - path: PrinterBridge
      # The SDK core, vendored by source. Headers only from core/include, the
      # eleven translation units from core/src — the same list CMakeLists.txt
      # builds for every other platform.
      - path: ../../../core/include
        name: core-include
        buildPhase: none
      - path: ../../../core/src
        name: core-src
        includes:
          - "*.cpp"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.printerdriver.ReceiptStudio
        PRODUCT_NAME: ReceiptStudio
        INFOPLIST_FILE: ReceiptStudio/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: PrinterBridge/ReceiptStudio-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../../core/include
          - $(SRCROOT)/PrinterBridge
        USER_HEADER_SEARCH_PATHS: $(SRCROOT)/PrinterBridge
        # The core is warning-clean under these on every other toolchain; keeping
        # them on here means an iOS-only regression shows up immediately.
        GCC_WARN_ABOUT_MISSING_PROTOTYPES: NO
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        ENABLE_BITCODE: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  ReceiptStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReceiptStudioTests
    dependencies:
      - target: ReceiptStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.printerdriver.ReceiptStudioTests
        GENERATE_INFOPLIST_FILE: YES
        # @testable import pulls in declarations that mention the bridge's
        # Objective-C types, so the test target needs the same bridging header.
        # It compiles none of the C++ — those symbols come from the host app.
        SWIFT_OBJC_BRIDGING_HEADER: PrinterBridge/ReceiptStudio-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/PrinterBridge
        USER_HEADER_SEARCH_PATHS: $(SRCROOT)/PrinterBridge
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO

schemes:
  ReceiptStudio:
    build:
      targets:
        ReceiptStudio: all
        ReceiptStudioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ReceiptStudioTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
